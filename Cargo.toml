[package]
name = "kurl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.31"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = "0.1.17"
uuid = { version = "1.28.0", features = ["v4"] }
