name: Get JSON
description: Fetch sample JSON data
method: GET
url: https://httpbin.org/get
headers:
- name: Accept
  value: application/json
  enabled: true
- name: User-Agent
  value: Posting-Rust/0.1.0
  enabled: true
params:
- name: format
  value: json
  enabled: true
- name: limit
  value: '10'
  enabled: true
